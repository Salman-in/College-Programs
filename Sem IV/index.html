<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Handling Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
            color: #333;
        }

        form,
        .result,
        .calendar,
        .mouse-over {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #b91516;
            border-radius: 4px;
            background-color: #91c169;
        }

        input,
        button,
        select {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #ec3c29;
        }

        .calendar table {
            width: 100%;
            border-collapse: collapse;
        }

        .calendar th,
        .calendar td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
    </style>
    <script>
        // Validation of registration form
        function validateForm() {
            var name = document.forms["regForm"]["name"].value;
            var email = document.forms["regForm"]["email"].value;
            var password = document.forms["regForm"]["password"].value;
            if (name == "") {
                alert("Name must be filled out");
                return false;
            }
            if (email == "") {
                alert("Email must be filled out");
                return false;
            }
            if (password.length < 6) {
                alert("Password must be at least 6 characters long");
                return false;
            }
            alert("Registration successful!");
            return true;
        }
        // Open a new window
        function openNewWindow() {
            window.open("https://www.example.com", "_blank", "width=600,height=400");
        }
        // Change background color
        function changeBackgroundColor() {
            var colors = ["#FF5733", "#33FF57", "#3357FF", "#F3FF33", "#FF33F3"];
            document.body.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        }
        // Generate calendar
        function generateCalendar() {
            var month = document.getElementById("month").value;
            var year = document.getElementById("year").value;
            var daysInMonth = new Date(year, month, 0).getDate();
            var calendar = "<table border='1'><tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr><tr>";
            var firstDay = new Date(year, month - 1, 1).getDay();
            for (var i = 0; i < firstDay; i++) {
                calendar += "<td></td>";
            }
            for (var day = 1; day <= daysInMonth; day++) {
                calendar += "<td>" + day + "</td>";
                if ((day + firstDay) % 7 == 0) calendar += "</tr><tr>";
            }
            calendar += "</tr></table>";
            document.getElementById("calendar").innerHTML = calendar;
        }
        // Change text on mouse over
        function changeText(element) {
            element.innerHTML = "Mouse Over Detected!";
        }
        function resetText(element) {
            element.innerHTML = "Hover over me!";
        }
        window.onload = changeBackgroundColor;
    </script>
</head>

<body>
    <h1>Event Handling Examples</h1>
    <!-- Form Validation -->
    <h2>Form Validation</h2>
    <form name="regForm" onsubmit="return validateForm()">
        Name: <input type="text" name="name"><br>
        Email: <input type="email" name="email"><br>
        Password: <input type="password" name="password"><br>
        <input type="submit" value="Register">
    </form>
    <!-- Open New Window -->
    <h2>Open New Window</h2>
    <button onclick="openNewWindow()">Open Window</button>
    <!-- Change Background Color -->
    <h2>Change Background Color</h2>
    <button onclick="changeBackgroundColor()">Change Background Color</button>
    <!-- Display Calendar -->
    <h2>Display Calendar</h2>
    <select id="month">
        <option value="1">January</option>
        <option value="2">February</option>
        <option value="3">March</option>
        <option value="4">April</option>
        <option value="5">May</option>
        <option value="6">June</option>
        <option value="7">July</option>
        <option value="8">August</option>
        <option value="9">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
    </select>
    <select id="year">
        <script>
            for (var year = 2000; year <= 2030; year++) {
                document.write('<option value="' + year + '">' + year + '</option>');
            }
        </script>
    </select>
    <button onclick="generateCalendar()">Generate Calendar</button>
    <div id="calendar"></div>

    <!-- Mouse Over Event -->
    <h2>Mouse Over Event</h2>
    <div class="mouse-over" onmouseover="changeText(this)" onmouseout="resetText(this)">
        Hover over me!
    </div>
</body>

</html>
